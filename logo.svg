<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FB0AD"/>
      <stop offset="100%" stop-color="#FF5A46"/>
    </linearGradient>
  </defs>

  <!-- badge background -->
  <circle cx="60" cy="60" r="56" fill="#FFFFFF"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- stopwatch -->
  <g stroke="#143238" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- top button -->
    <rect x="53" y="20" width="14" height="8" rx="3" fill="#143238" stroke="none"/>
    <!-- side crown -->
    <line x1="82" y1="30" x2="88" y2="24" stroke-width="5"/>
    <!-- watch face -->
    <circle cx="60" cy="62" r="30" stroke-width="6" fill="#FFFFFF"/>
    <!-- tick marks -->
    <line x1="60" y1="38" x2="60" y2="43" stroke-width="3"/>
    <line x1="60" y1="81" x2="60" y2="86" stroke-width="3"/>
    <line x1="36" y1="62" x2="41" y2="62" stroke-width="3"/>
    <line x1="79" y1="62" x2="84" y2="62" stroke-width="3"/>
    <!-- hands -->
    <line x1="60" y1="62" x2="60" y2="46" stroke-width="4.5"/>
    <line x1="60" y1="62" x2="72" y2="68" stroke-width="4.5"/>
    <!-- center pin -->
    <circle cx="60" cy="62" r="3" fill="#FF5A46" stroke="none"/>
  </g>

  <!-- water / wake lines -->
  <g stroke="#1FB0AD" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M20 100 Q30 94 40 100 T60 100"/>
    <path d="M58 106 Q68 100 78 106 T98 106"/>
  </g>
</svg>
